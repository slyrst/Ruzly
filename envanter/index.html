<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Envanter — Rüzly Card Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f5f5f0;
  --white:#ffffff;
  --blue:#0a6cf5;
  --blue-dark:#054dbf;
  --blue-light:#e8f0fe;
  --text:#1a1a1a;
  --muted:#666;
  --border:#ddd;
  --shadow:0 4px 24px rgba(10,108,245,0.10);
  --font:'Oswald',condensed,system-ui;
  --mono:'Share Tech Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}

body::before{
  content:'';position:fixed;inset:0;opacity:0.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  pointer-events:none;z-index:999;
}

.topbar{background:var(--white);border-bottom:2.5px solid var(--blue);box-shadow:0 2px 16px rgba(10,108,245,0.07);position:sticky;top:0;z-index:100;}
.topbar-inner{max-width:1200px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:16px;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);flex-shrink:0;}
.logo-mark{width:42px;height:42px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 16px rgba(10,108,245,0.3);position:relative;overflow:hidden;}
.logo-mark::after{content:'';position:absolute;top:50%;left:0;right:0;height:2px;background:rgba(255,255,255,0.4);}
.logo-ball{width:18px;height:18px;background:white;border-radius:50%;position:relative;z-index:1;}
.logo-ball::after{content:'';position:absolute;top:6px;left:0;right:0;height:2px;background:rgba(10,108,245,0.5);}
.logo-text{font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.logo-sub{font-size:10px;font-family:var(--mono);color:var(--blue);letter-spacing:2px;line-height:1;display:block;}
.topbar-actions{display:flex;gap:8px;align-items:center;margin-left:auto;}
button,.btn{font-family:var(--font);font-size:14px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;border:none;border-radius:7px;padding:9px 16px;transition:all .15s;}
.btn-primary{background:var(--blue);color:white;box-shadow:0 3px 12px rgba(10,108,245,0.25);}
.btn-primary:hover{background:var(--blue-dark);transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--text);border:2px solid var(--border);}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue);}
.btn-sm{padding:6px 12px;font-size:12px;}
.inv-btn{background:var(--white);border:2px solid var(--border);border-radius:7px;padding:8px 14px;display:flex;align-items:center;gap:7px;font-family:var(--font);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;transition:all .15s;}
.inv-btn:hover{border-color:var(--blue);color:var(--blue);}
.inv-badge{background:var(--blue);color:white;border-radius:999px;font-size:10px;padding:1px 6px;font-family:var(--mono);min-width:18px;text-align:center;}

.page{max-width:1200px;margin:0 auto;padding:28px 20px;}
.page-head{margin-bottom:24px;}
.page-head h1{font-size:32px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.page-head p{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:4px;}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--white);border:2px solid var(--border);border-radius:10px;padding:4px;margin-bottom:20px;width:fit-content;}
.tab{padding:8px 20px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-radius:7px;cursor:pointer;border:none;background:transparent;transition:all .15s;color:var(--muted);}
.tab.active{background:var(--blue);color:white;box-shadow:0 2px 10px rgba(10,108,245,0.25);}

/* CARD GRID */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}

/* POKEMON CARD */
.poke-card{
  background:var(--white);
  border:2px solid #e0e0e0;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 16px rgba(0,0,0,0.08);
  transition:all .2s cubic-bezier(.4,0,.2,1);
  position:relative;
  cursor:default;
}
.poke-card:hover{transform:translateY(-4px) rotate(-.5deg);box-shadow:0 12px 40px rgba(10,108,245,0.2);border-color:var(--blue);}

/* Rarity glow on hover */
.poke-card.rarity-R:hover{box-shadow:0 12px 40px rgba(106,27,154,0.3);border-color:#9c27b0;}
.poke-card.rarity-SR:hover{box-shadow:0 12px 40px rgba(255,152,0,0.4);border-color:#ff9800;}

.rarity-strip{position:absolute;top:0;left:0;right:0;height:4px;z-index:2;}
.strip-C{background:#bdbdbd;}
.strip-U{background:linear-gradient(90deg,#1565c0,#42a5f5);}
.strip-R{background:linear-gradient(90deg,#6a1b9a,#ce93d8);}
.strip-SR{background:linear-gradient(90deg,#e65100,#ffb300,#e65100);background-size:200%;animation:rstep 2s linear infinite;}
@keyframes rstep{to{background-position:200%;}}

.poke-img-wrap{
  height:160px;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  overflow:hidden;
}
.poke-img-wrap img{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
}
.poke-img-wrap .no-img{
  font-size:64px;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,0.15));
}
/* Holofoil on hover */
.poke-card:hover .poke-img-wrap::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 25%,rgba(255,255,255,0.3) 50%,transparent 75%);
  animation:holoshine .6s ease;
  pointer-events:none;
}
@keyframes holoshine{from{transform:translateX(-100%) skewX(-15deg)}to{transform:translateX(200%) skewX(-15deg)}}

.rarity-tag{
  position:absolute;bottom:8px;right:8px;
  font-size:10px;font-weight:700;font-family:var(--mono);
  padding:2px 8px;border-radius:4px;
  letter-spacing:.5px;
}
.rtag-C{background:rgba(0,0,0,0.6);color:#e0e0e0;}
.rtag-U{background:rgba(21,101,192,0.85);color:white;}
.rtag-R{background:rgba(106,27,154,0.85);color:white;}
.rtag-SR{background:rgba(230,81,0,0.9);color:white;animation:rstep 2s linear infinite;background-size:200%;}

.status-pip{
  position:absolute;top:12px;left:12px;
  font-size:10px;font-weight:700;font-family:var(--mono);
  padding:2px 8px;border-radius:4px;
  z-index:3;
}
.pip-owned{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7;}
.pip-pending{background:#fff8e1;color:#e65100;border:1px solid #ffcc02;}

.poke-body{padding:12px;}
.poke-name{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;line-height:1.2;}
.poke-cat{font-size:10px;font-family:var(--mono);color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.poke-desc{font-size:11px;font-family:var(--mono);color:var(--muted);margin-top:6px;line-height:1.5;min-height:32px;}
.poke-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;
  border-top:1px solid #f0f0f0;
  font-family:var(--mono);font-size:11px;color:var(--muted);
}
.poke-price{font-size:14px;font-weight:700;color:var(--blue);}
.poke-qty{background:var(--blue-light);color:var(--blue);border-radius:4px;padding:1px 8px;}

/* PENDING SECTION */
.pending-alert{
  background:linear-gradient(135deg,#fff8e1,#fff3cd);
  border:2px solid #ffb300;border-radius:12px;
  padding:16px 18px;margin-bottom:20px;
}
.pending-alert h3{font-size:15px;color:#e65100;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.pending-alert p{font-family:var(--mono);font-size:12px;color:#795548;}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-family:var(--mono);font-size:13px;grid-column:1/-1;}
.empty-icon{font-size:56px;margin-bottom:12px;}

/* MODAL */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-back.open{display:flex;}
.modal{background:var(--white);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,0.25);animation:mIn .2s cubic-bezier(.4,0,.2,1);}
@keyframes mIn{from{opacity:0;transform:scale(.95) translateY(10px)}}
.modal-head{background:var(--blue);color:white;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:16px 16px 0 0;}
.modal-head h2{font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.modal-close{background:rgba(255,255,255,0.15);border:none;color:white;width:30px;height:30px;border-radius:6px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:rgba(255,255,255,0.25);}
.modal-body{padding:20px;}

/* DETAIL CARD */
.detail-img{width:100%;height:200px;object-fit:cover;border-radius:8px;margin-bottom:14px;}
.detail-emoji{width:100%;height:200px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:80px;margin-bottom:14px;}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f0f0f0;font-family:var(--mono);font-size:12px;}
.detail-row:last-child{border:none;}
.detail-key{color:var(--muted);}
.detail-val{font-weight:700;color:var(--text);}

::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px;}::-webkit-scrollbar-thumb:hover{background:var(--blue);}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="../">
      <div class="logo-mark"><div class="logo-ball"></div></div>
      <div>
        <div class="logo-text">Rüzly</div>
        <span class="logo-sub">CARD SHOP</span>
      </div>
    </a>
    <div class="topbar-actions">
      
      <button class="inv-btn" id="notifBtn" onclick="showNotifModal()">
        🔔 <span class="inv-badge" id="notifCount" style="display:none">0</span>
      </button>
      <button class="inv-btn" id="adminBtn" style="display:none;background:#e8f5e9;border-color:#a5d6a7;color:#2e7d32">👑 Admin</button>
      <div id="userArea"></div>
      <button id="signinBtn" class="btn-ghost btn">Giriş Yap</button>
    </div>
  </div>
</header>

<div class="page">
  <div class="page-head">
    <h1>🎒 Envanter</h1>
    <p id="pageSubtitle">// Kartlarınız burada listelenir</p>
  </div>

  <div id="pendingAlert" style="display:none"></div>

  <div class="tabs">
    <button class="tab active" id="tabAll" onclick="setTab('all')">Tümü</button>
    <button class="tab" id="tabOwned" onclick="setTab('owned')">✓ Sahip Olduklarım</button>
    <button class="tab" id="tabPending" onclick="setTab('pending')">⏳ Bekleyenler</button>
  </div>

  <div id="cardGrid" class="card-grid">
    <div class="empty"><div class="empty-icon">🔐</div>Giriş yaparak envanterinizi görün.</div>
  </div>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal" id="modalContent"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDzGTlPWmfz9gg-0EYvvNjZr0dJahTcMrg",authDomain:"ruzly-7af10.firebaseapp.com",projectId:"ruzly-7af10",storageBucket:"ruzly-7af10.appspot.com",messagingSenderId:"223649665023",appId:"1:223649665023:web:c963b16cf626c5184d61ca",measurementId:"G-X4NKTW89XH"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
let currentUser=null,allInvItems=[],activeTab='all',notifUnsub=null,cachedNotifs=[];
const qs=s=>document.querySelector(s);
const qsa=s=>document.querySelectorAll(s);
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function money(n){return '₺'+Number(n||0).toFixed(2);}
function openModal(html){qs('#modalContent').innerHTML=html;qs('#modalBack').classList.add('open');}
function closeModal(){qs('#modalBack').classList.remove('open');qs('#modalContent').innerHTML='';}
qs('#modalBack').addEventListener('click',e=>{if(e.target===qs('#modalBack'))closeModal();});

function getRarity(r,price){
  if(r&&['C','U','R','SR'].includes(r))return r;
  if(price>=500)return'SR';
  if(price>=100)return'R';
  if(price>=25)return'U';
  return'C';
}
function rarityLabel(r){return{C:'Common',U:'Uncommon',R:'Rare',SR:'Secret Rare'}[r]||r;}
function cardEmoji(cat){return{Pack:'📦',Single:'🃏',Accessory:'🧢',Bundle:'🎁'}[cat]||'🎴';}
function cardBg(cat){return{Pack:'linear-gradient(135deg,#fff3e0,#ffe0b2)',Single:'linear-gradient(135deg,#e3f2fd,#bbdefb)',Accessory:'linear-gradient(135deg,#f3e5f5,#e1bee7)',Bundle:'linear-gradient(135deg,#e8f5e9,#c8e6c9)'}[cat]||'linear-gradient(135deg,#f5f5f5,#eee)';}

function setTab(tab){
  activeTab=tab;
  qsa('.tab').forEach(t=>t.classList.remove('active'));
  qs('#tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('active');
  renderGrid();
}

function renderGrid(){
  const grid=qs('#cardGrid');
  let items=allInvItems.slice();
  if(activeTab==='owned')items=items.filter(i=>i.status==='owned');
  if(activeTab==='pending')items=items.filter(i=>i.status==='pending');
  if(items.length===0){
    grid.innerHTML=`<div class="empty"><div class="empty-icon">${activeTab==='pending'?'⏳':'✨'}</div>${activeTab==='pending'?'Bekleyen sipariş yok.':'Henüz kart yok. Mağazadan satın alın!'}</div>`;
    return;
  }
  grid.innerHTML='';
  items.forEach(it=>{
    const rarity=getRarity(it.rarity,it.price||0);
    const div=document.createElement('div');
    div.className=`poke-card rarity-${rarity}`;
    div.innerHTML=`
      <div class="rarity-strip strip-${rarity}"></div>
      <div class="status-pip ${it.status==='pending'?'pip-pending':'pip-owned'}">${it.status==='pending'?'⏳ Bekliyor':'✓ Sahip'}</div>
      <div class="poke-img-wrap" style="background:${cardBg(it.cat)}">
        ${it.imageUrl?`<img src="${esc(it.imageUrl)}" alt="${esc(it.title)}"/>`:`<div class="no-img">${cardEmoji(it.cat)}</div>`}
        <span class="rarity-tag rtag-${rarity}">${rarity}</span>
      </div>
      <div class="poke-body">
        <div class="poke-name">${esc(it.title)}</div>
        <div class="poke-cat">${esc(it.fromPack?'📦 '+it.fromPack:it.cat||'Single')}</div>
        <div class="poke-desc">${esc(it.desc||'')}</div>
      </div>
      <div class="poke-footer">
        <div class="poke-price">${it.price?money(it.price):'—'}</div>
        <div class="poke-qty">${it.qty||1}×</div>
      </div>
      <div style="padding:0 10px 10px;display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm viewCardBtn" style="flex:1;font-size:11px">👁 Görüntüle</button>
        <button class="btn btn-primary btn-sm alBtn" style="flex:1;font-size:11px;background:#2e7d32;box-shadow:none">🤝 Al</button>
      </div>`;
    div.querySelector('.viewCardBtn').onclick=e=>{e.stopPropagation();showCardDetail(it);};
    div.querySelector('.alBtn').onclick=e=>{e.stopPropagation();sendPickupRequest(it);};
    grid.appendChild(div);
  });
}

function showCardDetail(it){
  const rarity=getRarity(it.rarity,it.price||0);
  const colors={SR:'linear-gradient(135deg,#e65100,#ff9800)',R:'linear-gradient(135deg,#6a1b9a,#9c27b0)',U:'linear-gradient(135deg,#1565c0,#42a5f5)'};
  openModal(`
    <div class="modal-head" style="background:${colors[rarity]||'var(--blue)'}">
      <h2>${esc(it.title)}</h2>
      <button class="modal-close" id="mc">✕</button>
    </div>
    <div class="modal-body">
      ${it.imageUrl
        ?`<img src="${esc(it.imageUrl)}" style="width:100%;max-height:280px;object-fit:contain;border-radius:10px;background:#f0f0f0;display:block;margin-bottom:14px"/>`
        :`<div style="width:100%;height:140px;background:${cardBg(it.cat)};border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:72px;margin-bottom:14px">${cardEmoji(it.cat)}</div>`}
      ${it.desc?`<div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:12px;padding:10px;background:var(--bg);border-radius:8px">${esc(it.desc)}</div>`:''}
      <div class="detail-row"><span class="detail-key">Nadirlik</span><span class="detail-val">${rarityLabel(rarity)} (${rarity})</span></div>
      <div class="detail-row"><span class="detail-key">Kategori</span><span class="detail-val">${esc(it.cat||'—')}</span></div>
      ${it.fromPack?`<div class="detail-row"><span class="detail-key">Pack</span><span class="detail-val">📦 ${esc(it.fromPack)}</span></div>`:''}
      ${it.price?`<div class="detail-row"><span class="detail-key">Fiyat</span><span class="detail-val" style="color:var(--blue)">${money(it.price)}</span></div>`:''}
      <div class="detail-row"><span class="detail-key">Adet</span><span class="detail-val">${it.qty||1}</span></div>
      <div class="detail-row"><span class="detail-key">Satıcı</span><span class="detail-val">${esc(it.sellerName||'—')}</span></div>
      <div class="detail-row"><span class="detail-key">Durum</span><span class="detail-val" style="color:${it.status==='owned'?'#2e7d32':'#e65100'}">${it.status==='owned'?'✓ Sahipsin':'⏳ Ödeme Bekleniyor'}</span></div>
      ${it.status==='pending'?`<div id="deliveryInfo" style="margin-top:12px"></div>`:''}
    </div>`);
  qs('#mc').onclick=closeModal;
  if(it.status==='pending'){
    db.collection('sellerNotifications').where('buyerId','==',currentUser.uid).where('itemId','==',it.itemId).get()
      .then(snap=>{
        const el=qs('#deliveryInfo');if(!el)return;
        if(!snap.empty){
          const n=snap.docs[0].data();
          el.innerHTML=n.deliveryDay
            ?`<div style="background:#e8f5e9;border:2px solid #a5d6a7;border-radius:10px;padding:12px;font-family:var(--mono);font-size:12px;color:#2e7d32">📅 Satıcı teslimat belirledi: <strong>${esc(n.deliveryDay)}</strong></div>`
            :`<div style="background:#fff8e1;border:2px solid #ffb300;border-radius:10px;padding:12px;font-family:var(--mono);font-size:12px;color:#e65100">⏳ Satıcı henüz teslimat günü belirlemedi.</div>`;
        }
      }).catch(()=>{});
  }
}

async function sendPickupRequest(it){
  if(!currentUser)return;
  if(!window.confirm('"'+it.title+'" kartını aldın mı? Envanterden silinecek.'))return;
  try{
    await db.collection('inventory').doc(it.id).delete();
    const t=document.createElement('div');
    t.style.cssText='position:fixed;bottom:30px;right:30px;background:white;border:2px solid #2e7d32;border-radius:12px;padding:16px 20px;box-shadow:0 8px 40px rgba(0,0,0,0.15);z-index:500;font-family:var(--font);max-width:300px;';
    t.innerHTML='<div style="font-weight:700;color:#2e7d32">✓ Kart Alındı!</div><div style="font-size:12px;margin-top:4px">'+esc(it.title)+'</div>';
    document.body.appendChild(t);setTimeout(()=>t.remove(),3000);
    await loadInventory();
  }catch(e){alert('Hata: '+e.message);}
}

async function loadInventory(){
  if(!currentUser){qs('#cardGrid').innerHTML=`<div class="empty"><div class="empty-icon">🔐</div>Giriş yaparak envanterinizi görün.</div>`;return;}
  qs('#cardGrid').innerHTML=`<div class="empty"><div class="empty-icon" style="animation:spin 1s linear infinite;display:inline-block">⏳</div><div style="margin-top:8px">Yükleniyor...</div></div>`;
  try{
    const snap=await db.collection('inventory').where('userId','==',currentUser.uid).get();
    const base=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.addedAt?.seconds||0)-(a.addedAt?.seconds||0));
    const enriched=await Promise.all(base.map(async inv=>{
      try{
        const itemDoc=await db.collection('items').doc(inv.itemId).get();
        if(itemDoc.exists){const d=itemDoc.data();return{...inv,desc:inv.desc||d.desc||'',imageUrl:inv.imageUrl||d.imageUrl||'',cat:inv.cat||d.cat,rarity:inv.rarity||d.rarity};}
      }catch(e){}
      return inv;
    }));
    allInvItems=enriched;
    const pending=enriched.filter(i=>i.status==='pending');
    if(pending.length>0){
      qs('#pendingAlert').style.display='block';
      qs('#pendingAlert').innerHTML=`<div class="pending-alert"><h3>⏳ ${pending.length} Bekleyen Ödeme</h3><p>Bu kartlar nakit ödeme bekleniyor. Satıcı teslimat günü belirleyecek.</p></div>`;
    }else{qs('#pendingAlert').style.display='none';}
    qs('#pageSubtitle').textContent=`// ${enriched.length} kart — ${pending.length} bekleyen`;
    renderGrid();
  }catch(e){
    console.error('ENVANTER HATA:',e.code,e.message);
    qs('#cardGrid').innerHTML=`<div class="empty"><div class="empty-icon">❌</div><div style="font-family:var(--mono);font-size:12px">Hata: ${esc(e.message)}</div></div>`;
  }
}

function listenNotifications(){
  if(notifUnsub)notifUnsub();
  if(window.notifUnsub2)window.notifUnsub2();
  if(!currentUser)return;
  const allDocs={};
  function merge(docs){
    docs.forEach(d=>allDocs[d.id]={id:d.id,...d.data()});
    cachedNotifs=Object.values(allDocs)
      .filter(n=>n.read===false)
      .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    const badge=qs('#notifCount');
    if(cachedNotifs.length>0){badge.style.display='inline-block';badge.textContent=cachedNotifs.length;}
    else{badge.style.display='none';}
  }
  notifUnsub=db.collection('sellerNotifications')
    .where('sellerId','==',currentUser.uid)
    .onSnapshot(snap=>{merge(snap.docs);},e=>console.error('notif1:',e.message));
  window.notifUnsub2=db.collection('sellerNotifications')
    .where('sellerId','==',currentUser.email)
    .onSnapshot(snap=>{merge(snap.docs);},e=>console.error('notif2:',e.message));
}

function showNotifModal(){
  if(!currentUser){
    openModal(`<div class="modal-head"><h2>🔔 Bildirimler</h2><button class="modal-close" id="mc">✕</button></div><div class="modal-body"><p style="font-family:var(--mono)">Giriş yapın.</p></div>`);
    qs('#mc').onclick=closeModal;return;
  }
  if(cachedNotifs.length===0){
    openModal(`<div class="modal-head"><h2>🔔 Bildirimler</h2><button class="modal-close" id="mc">✕</button></div><div class="modal-body"><div style="font-family:var(--mono);color:var(--muted);text-align:center;padding:30px">Yeni bildirim yok.</div></div>`);
    qs('#mc').onclick=closeModal;return;
  }
  const rows=cachedNotifs.map(n=>{
    const isPickup=n.type==='pickup';
    return `<div style="border:2px solid ${isPickup?'#a5d6a7':'var(--border)'};border-radius:10px;padding:14px;margin-bottom:10px;background:${isPickup?'#f1f8f1':'white'}">
      <div style="font-size:15px;font-weight:700">${isPickup?'🤝 ':''}${esc(n.buyerName||'Alıcı')}</div>
      <div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin:4px 0">${esc(n.itemTitle)} × ${n.qty||1}</div>
      ${isPickup
        ?`<div style="background:#e8f5e9;border:1px solid #a5d6a7;border-radius:6px;padding:8px 12px;font-family:var(--mono);font-size:12px;color:#2e7d32;margin:8px 0">📬 Alıcı kartı okulda teslim almak istiyor!</div>
          <button class="btn btn-primary btn-sm confirmCash" data-id="${n.id}" data-uid="${n.buyerId}" data-item="${n.itemId}" data-invid="${n.inventoryId||""}">✓ Kartı Verdim — Onayla</button>`
        :n.deliveryDay
          ?`<div style="background:#e8f5e9;border:1px solid #a5d6a7;border-radius:6px;padding:8px;font-family:var(--mono);font-size:12px;color:#2e7d32;margin:8px 0">📅 Teslimat: <strong>${esc(n.deliveryDay)}</strong></div>
            <button class="btn btn-primary btn-sm confirmCash" data-id="${n.id}" data-uid="${n.buyerId}" data-item="${n.itemId}" data-invid="${n.inventoryId||""}">✓ Nakit Teslim Alındı</button>`
          :`<div style="background:#fff8e1;border:1px solid #ffb300;border-radius:6px;padding:8px;font-family:var(--mono);font-size:11px;color:#e65100;margin:8px 0">⏳ Teslimat günü belirle</div>
            <div style="display:flex;gap:8px;margin-top:6px">
              <select class="deliverySelect" data-id="${n.id}" style="flex:1;padding:7px;border:2px solid var(--border);border-radius:7px;font-family:var(--font);font-size:12px">
                <option value="">Gün Seç...</option>
                <option value="Yarın">Yarın</option>
                <option value="2 gün">2 gün</option>
                <option value="3 gün">3 gün</option>
                <option value="5 gün">5 gün</option>
                <option value="1 hafta">1 hafta</option>
              </select>
              <button class="btn btn-primary btn-sm setDelivery" data-id="${n.id}">Al ✓</button>
            </div>`
      }
      <button class="btn btn-ghost btn-sm markRead" data-id="${n.id}" style="margin-top:8px">Kapat</button>
    </div>`;
  }).join('');
  openModal(`<div class="modal-head"><h2>🔔 Satıcı Bildirimleri</h2><button class="modal-close" id="mc">✕</button></div><div class="modal-body">${rows}</div>`);
  qs('#mc').onclick=closeModal;
  qsa('.markRead').forEach(b=>b.onclick=async()=>{await db.collection('sellerNotifications').doc(b.dataset.id).update({read:true});showNotifModal();});
  qsa('.setDelivery').forEach(b=>b.onclick=async()=>{
    const sel=qs(`.deliverySelect[data-id="${b.dataset.id}"]`);
    if(!sel?.value){alert('Gün seç!');return;}
    await db.collection('sellerNotifications').doc(b.dataset.id).update({deliveryDay:sel.value});
    showNotifModal();
  });
  qsa('.confirmCash').forEach(b=>b.onclick=async()=>{
    try{
      const batch=db.batch();
      if(b.dataset.invid){
        // Direct inventory doc id
        batch.update(db.collection('inventory').doc(b.dataset.invid),{status:'owned'});
      }else{
        const snap=await db.collection('inventory').where('userId','==',b.dataset.uid).where('itemId','==',b.dataset.item).where('status','==','pending').get();
        snap.docs.forEach(d=>batch.update(d.ref,{status:'owned'}));
      }
      batch.update(db.collection('sellerNotifications').doc(b.dataset.id),{read:true});
      await batch.commit();
      await loadInventory();
      showNotifModal();
    }catch(e){alert('Hata: '+e.message);}
  });
}

const ADMIN_EMAIL='urtugaz@gmail.com';

async function showAdminPanel(){
  openModal(`<div class="modal-head" style="background:linear-gradient(135deg,#2e7d32,#4caf50)"><h2>👑 Admin — Tüm Envanterler</h2><button class="modal-close" id="mc">✕</button></div><div class="modal-body"><div style="font-family:var(--mono);color:var(--muted);text-align:center;padding:20px">Yükleniyor...</div></div>`);
  qs('#mc').onclick=closeModal;
  try{
    const snap=await db.collection('inventory').get();
    const byUser={};
    snap.docs.forEach(d=>{const it=d.data();const u=it.userName||it.userId||'?';if(!byUser[u])byUser[u]=[];byUser[u].push(it);});
    const rColors={C:'#757575',U:'#1565c0',R:'#6a1b9a',SR:'#e65100'};
    let html=Object.entries(byUser).map(([user,items])=>`
      <div style="border:2px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden">
        <div style="background:var(--blue-light);padding:10px 14px;display:flex;justify-content:space-between">
          <div style="font-weight:700">👤 ${esc(user)}</div>
          <div style="font-family:var(--mono);font-size:11px;color:var(--muted)">${items.filter(i=>i.status==='owned').length} sahip · ${items.filter(i=>i.status==='pending').length} bekleyen</div>
        </div>
        <div style="padding:10px;display:flex;flex-wrap:wrap;gap:6px">
          ${items.map(it=>`<div style="background:${it.status==='pending'?'#fff8e1':'#f5f5f0'};border:1.5px solid ${it.status==='pending'?'#ffb300':'#ddd'};border-radius:7px;padding:4px 10px;font-size:12px;font-family:var(--mono)">
            ${it.rarity?`<span style="color:${rColors[it.rarity]||'#666'};font-weight:700">${it.rarity}</span> `:''}${esc(it.title||'?')} ×${it.qty||1} ${it.status==='pending'?'⏳':'✓'}
          </div>`).join('')}
        </div>
      </div>`).join('');
    qs('#modalContent').innerHTML=`<div class="modal-head" style="background:linear-gradient(135deg,#2e7d32,#4caf50)"><h2>👑 Admin — ${Object.keys(byUser).length} Kullanıcı</h2><button class="modal-close" id="mc">✕</button></div><div class="modal-body">${html||'<p style="font-family:var(--mono);color:var(--muted)">Henüz envanter yok.</p>'}</div>`;
    qs('#mc').onclick=closeModal;
  }catch(e){alert('Admin hata: '+e.message);}
}

async function renderUserArea(){
  if(currentUser){
    qs('#userArea').innerHTML=`<button class="btn-ghost btn btn-sm">👤 ${esc(currentUser.displayName||currentUser.email.split('@')[0])}</button>`;
    qs('#signinBtn').textContent='Çıkış';
    qs('#signinBtn').onclick=()=>auth.signOut();
    if(currentUser.email===ADMIN_EMAIL){qs('#adminBtn').style.display='flex';qs('#adminBtn').onclick=showAdminPanel;}
    await loadInventory();
    listenNotifications();
  }else{
    qs('#userArea').innerHTML='';
    qs('#signinBtn').textContent='Giriş Yap';
    qs('#signinBtn').onclick=()=>{location.href='../shop/';};
    qs('#cardGrid').innerHTML=`<div class="empty"><div class="empty-icon">🔐</div>Giriş yaparak envanterinizi görün.</div>`;
  }
}

auth.onAuthStateChanged(async user=>{currentUser=user;await renderUserArea();});
</script>
