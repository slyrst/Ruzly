<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garty - Redirect</title>
    <style>
        :root {
            --bg-color: #eef2ff;
            --nav-bg: #d6daf0;
            --nav-border: #b7c5d9;
            --header-purple: #9988ee;
            --text-main: #000000;
            --text-link: #34345c;
            --title-red: #af0a0f;
            --border-dark: #000000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: arial, helvetica, sans-serif;
            font-size: 13px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #nav {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            z-index: 9999;
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--nav-border);
            padding: 3px 10px;
            font-size: 10pt;
            white-space: nowrap;
            overflow-x: auto;
        }

        #nav a {
            text-decoration: none;
            color: var(--text-link);
        }

        #nav a:hover {
            color: #ff0000;
            text-decoration: underline;
        }

        .nav-group { display: inline-block; margin-right: 6px; }
        .bracket { color: var(--text-link); }

        .header-area {
            text-align: center;
            margin: 30px 0 20px;
        }

        .site-icon {
            width: 230px;
            height: 254px;
            display: block;
            margin: 0 auto;
            border: 0;
            image-rendering: pixelated;
        }

        .site-title {
            font-family: serif;
            color: var(--title-red);
            font-size: 32px;
            font-weight: bold;
            text-decoration: none;
            display: block;
            margin: 10px 0;
        }

        .wrapper {
            width: 95%;
            max-width: 600px;
            margin: 0 auto;
        }

        .box-title {
            background-color: var(--header-purple);
            color: #000;
            font-weight: bold;
            padding: 3px 8px;
            border: 1px solid var(--border-dark);
            border-bottom: none;
            display: inline-block;
            min-width: 100px;
        }

        .box-content {
            border: 1px solid var(--border-dark);
            background: #fff;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        .box-content p {
            margin-bottom: 16px;
            line-height: 1.6;
            color: #333;
        }

        .redirect-btn {
            display: inline-block;
            background-color: var(--header-purple);
            color: #000;
            font-family: arial, helvetica, sans-serif;
            font-size: 13px;
            font-weight: bold;
            border: 2px solid var(--border-dark);
            padding: 8px 22px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.1s, color 0.1s;
            margin: 6px 4px;
        }

        .redirect-btn:hover {
            background-color: #34345c;
            color: #fff;
        }

        .redirect-btn:active {
            background-color: #af0a0f;
            color: #fff;
        }

        .countdown {
            margin-top: 14px;
            font-size: 12px;
            color: #555;
        }

        #count {
            font-weight: bold;
            color: var(--title-red);
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 11px;
            color: #555;
            margin-top: auto;
        }
        #rain-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .raindrop {
            position: absolute;
            top: -80px;
            width: 48px;
            height: 48px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .wrapper, .header-area, footer {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
<div id="rain-container"></div>



<div class="header-area">
    <img src="dancing_swede.gif" alt="Garty" class="site-icon"
         onerror="this.style.display='none'">
    <a href="https://gemparty.soy" class="site-title">gemparty.soy</a>
</div>

<div class="wrapper">
    <div class="box-title">Redirect</div>
    <div class="box-content">
        <p>You are about to be taken to <strong>gemparty.soy</strong>.<br>
        An imageboard dedicated to the creation, posting, and sharing of soyjaks.</p>

        <a class="redirect-btn" href="https://gemparty.soy" id="go-btn">
            [ Go to gemparty.soy ]
        </a>

        <div class="countdown">
            Auto-redirecting in <span id="count">5</span> seconds&hellip;
            &nbsp;&nbsp;<a href="#" onclick="cancelRedirect(); return false;" style="color:var(--text-link);">cancel</a>
        </div>
    </div>
</div>

<footer>- vichan 5.1.4 -</footer>

<script>
    var secs = 5;
    var timer = null;
    var cancelled = false;

    function tick() {
        if (cancelled) return;
        secs--;
        document.getElementById('count').textContent = secs;
        if (secs <= 0) {
            clearInterval(timer);
            window.location.href = 'https://gemparty.soy';
        }
    }

    function cancelRedirect() {
        cancelled = true;
        clearInterval(timer);
        var cd = document.querySelector('.countdown');
        if (cd) cd.textContent = 'Auto-redirect cancelled. Click the button to proceed.';
    }

    timer = setInterval(tick, 1000);

    (function spawnRain() {
        var container = document.getElementById('rain-container');
        var IMG_SRC = 'https://soybooru.com/api/booru/posts/1025/file';
        var COUNT = 18;

        for (var i = 0; i < COUNT; i++) {
            (function(i) {
                setTimeout(function() {
                    var img = document.createElement('img');
                    img.src = IMG_SRC;
                    img.className = 'raindrop';
                    var left = Math.random() * 100;
                    var duration = 2.5 + Math.random() * 3;
                    var delay = Math.random() * 4;
                    var size = 32 + Math.floor(Math.random() * 32);
                    img.style.left = left + 'vw';
                    img.style.width = size + 'px';
                    img.style.height = size + 'px';
                    img.style.animationDuration = duration + 's';
                    img.style.animationDelay = delay + 's';
                    container.appendChild(img);

                    img.addEventListener('animationiteration', function() {
                        img.style.left = (Math.random() * 100) + 'vw';
                        img.style.animationDuration = (2.5 + Math.random() * 3) + 's';
                    });
                }, i * 150);
            })(i);
        }
    })();
</script>
</body>
</html>
